name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # 只装 CPU 侧轻量依赖：单元测试刻意不加载任何模型权重，
      # 这样 CI 几分钟内能跑完，不需要 GPU 也不需要下载 GB 级 checkpoint。
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[serve,dev]"

      - name: Static checks (syntax + undefined names)
        run: |
          python -m pip install ruff
          ruff check --select E9,F63,F7,F82 poisonguard tests

      - name: Unit tests
        run: python -m pytest tests/ -q --cov=poisonguard --cov-report=term-missing

      # 端到端烟测（B6）：内置 tiny 编码器，零下载，跑通
      # data → detect → scan → deploy → run 五段链路 + 签名链路。
      # 单元测试不加载模型，接线断了不会红；这一段才是防线。
      - name: End-to-end smoke (tiny encoder)
        run: python scripts/ci_smoke.py
