# poisonguard 多实例部署 —— Nginx 7 层反代示例（配合 docs/多实例部署.md）
# 用法：镜像里 serve 副本（可 --scale） + 本反代；/batch/ 走会话亲和。

upstream poisonguard {
    # /score 无状态：轮询
    server serve:8000;
    server serve:8000;
    server serve:8000;
    server serve:8000;
}

server {
    listen 80;

    # 健康检查：给 LB 用，不带 key 也应可探（无鉴权模式 200）
    location /health {
        proxy_pass http://poisonguard;
    }

    # 批处理队列在"提交它的那个实例"里：必须会话亲和，否则轮询 404
    location /batch/ {
        proxy_pass http://poisonguard;
        sticky cookie srv_id expires=1h;
    }

    location / {
        proxy_pass http://poisonguard;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
